<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#1967d2"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#16803c"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#c75b12"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#182230}.heading{font:700 20px Arial,sans-serif;fill:#182230}.body{font:16px Arial,sans-serif;fill:#2d3748}.small{font:14px Arial,sans-serif;fill:#4a5568}.box{stroke:#334155;stroke-width:2;rx:14}.line{fill:none;stroke-width:4}.label{font:700 14px Arial,sans-serif}
    </style>
  </defs>
  <rect width="1600" height="950" fill="#f6f8fb"/>
  <text x="800" y="52" text-anchor="middle" class="title">Smart Room Guardian: Hardware-in-the-Loop Test Stand</text>
  <text x="800" y="80" text-anchor="middle" class="small">ESP32-S3 DUT with sensor stimulation, local observation, and MQTT E2E verification</text>

  <rect x="50" y="135" width="430" height="280" fill="#e8f0fe" class="box"/>
  <text x="265" y="175" text-anchor="middle" class="heading">TEST PC / AQA ENVIRONMENT</text>
  <rect x="85" y="205" width="165" height="75" fill="#fff" class="box"/>
  <text x="167" y="235" text-anchor="middle" class="body">pytest</text><text x="167" y="260" text-anchor="middle" class="small">test runner</text>
  <rect x="280" y="205" width="165" height="75" fill="#fff" class="box"/>
  <text x="362" y="235" text-anchor="middle" class="body">HIL Controller</text><text x="362" y="260" text-anchor="middle" class="small">PySerial / fixtures</text>
  <rect x="85" y="315" width="360" height="65" fill="#fff" class="box"/>
  <text x="265" y="343" text-anchor="middle" class="body">Assertions + JUnit / serial logs</text><text x="265" y="366" text-anchor="middle" class="small">test evidence and reporting</text>
  <path d="M250 242 L280 242" class="line" stroke="#1967d2" marker-end="url(#arrow-blue)"/>

  <rect x="620" y="135" width="360" height="280" fill="#fff4df" class="box"/>
  <text x="800" y="175" text-anchor="middle" class="heading">DUT: ESP32-S3</text>
  <rect x="675" y="215" width="250" height="120" fill="#fff" class="box"/>
  <text x="800" y="250" text-anchor="middle" class="body">Smart Room Guardian</text><text x="800" y="278" text-anchor="middle" class="small">sensor sampling + alarm logic</text><text x="800" y="306" text-anchor="middle" class="small">Wi-Fi + MQTT client</text>
  <text x="800" y="370" text-anchor="middle" class="small">USB / UART diagnostics and control</text>

  <rect x="1120" y="135" width="430" height="280" fill="#e7f6ec" class="box"/>
  <text x="1335" y="175" text-anchor="middle" class="heading">PHYSICAL / SIMULATED I/O</text>
  <rect x="1160" y="210" width="155" height="70" fill="#fff" class="box"/>
  <text x="1237" y="238" text-anchor="middle" class="body">DHT22</text><text x="1237" y="261" text-anchor="middle" class="small">temperature / humidity</text>
  <rect x="1345" y="210" width="155" height="70" fill="#fff" class="box"/>
  <text x="1422" y="238" text-anchor="middle" class="body">Photoresistor</text><text x="1422" y="261" text-anchor="middle" class="small">ambient light ADC</text>
  <rect x="1252" y="320" width="165" height="60" fill="#fff" class="box"/>
  <text x="1335" y="356" text-anchor="middle" class="body">Red LED / alarm</text>

  <path d="M480 242 L620 242" class="line" stroke="#1967d2" marker-end="url(#arrow-blue)"/>
  <text x="550" y="225" text-anchor="middle" class="label" fill="#1967d2">USB/UART control</text>
  <path d="M980 240 L1160 240" class="line" stroke="#c75b12" marker-end="url(#arrow-orange)"/>
  <text x="1070" y="222" text-anchor="middle" class="label" fill="#c75b12">sensor stimulation</text>
  <path d="M980 300 L1252 350" class="line" stroke="#16803c" marker-end="url(#arrow-green)"/>
  <text x="1080" y="332" text-anchor="middle" class="label" fill="#16803c">alarm observation</text>

  <rect x="350" y="540" width="330" height="210" fill="#e8f0fe" class="box"/>
  <text x="515" y="580" text-anchor="middle" class="heading">NETWORK UNDER TEST</text>
  <rect x="405" y="625" width="220" height="70" fill="#fff" class="box"/>
  <text x="515" y="654" text-anchor="middle" class="body">Wi-Fi Access Point</text><text x="515" y="678" text-anchor="middle" class="small">fault injection point</text>

  <rect x="850" y="540" width="330" height="210" fill="#e7f6ec" class="box"/>
  <text x="1015" y="580" text-anchor="middle" class="heading">MESSAGING / VERIFICATION</text>
  <rect x="905" y="625" width="220" height="70" fill="#fff" class="box"/>
  <text x="1015" y="654" text-anchor="middle" class="body">MQTT Broker</text><text x="1015" y="678" text-anchor="middle" class="small">srg/room/* topics</text>
  <rect x="1220" y="540" width="300" height="210" fill="#fff4df" class="box"/>
  <text x="1370" y="580" text-anchor="middle" class="heading">MQTT TEST CLIENT</text>
  <text x="1370" y="630" text-anchor="middle" class="body">paho-mqtt subscriber</text><text x="1370" y="660" text-anchor="middle" class="small">payload / cadence assertions</text><text x="1370" y="690" text-anchor="middle" class="small">capture JSON evidence</text>

  <path d="M800 415 L515 625" class="line" stroke="#1967d2" marker-end="url(#arrow-blue)"/>
  <text x="635" y="505" text-anchor="middle" class="label" fill="#1967d2">Wi-Fi link</text>
  <path d="M680 650 L905 650" class="line" stroke="#16803c" marker-end="url(#arrow-green)"/>
  <path d="M1125 650 L1220 650" class="line" stroke="#16803c" marker-end="url(#arrow-green)"/>
  <text x="805" y="632" text-anchor="middle" class="label" fill="#16803c">MQTT telemetry</text>

  <rect x="50" y="830" width="1500" height="70" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="10"/>
  <line x1="90" y1="865" x2="170" y2="865" class="line" stroke="#1967d2"/><text x="190" y="871" class="small">control / network path</text>
  <line x1="490" y1="865" x2="570" y2="865" class="line" stroke="#c75b12"/><text x="590" y="871" class="small">input stimulation</text>
  <line x1="850" y1="865" x2="930" y2="865" class="line" stroke="#16803c"/><text x="950" y="871" class="small">output observation / telemetry</text>
</svg>
